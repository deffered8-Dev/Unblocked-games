<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paddle Duel</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #0b0d11;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 12px;
        gap: 10px;
        max-width: 760px;
        margin: 0 auto;
      }
      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #161920;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
      }
      .metrics { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
      .metric strong { color: #fbbf24; margin-left: 4px; }
      .actions { display: flex; gap: 8px; }
      button {
        background: #232730;
        color: #e2e8f0;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 7px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111318;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        overflow: hidden;
      }
      canvas { display: block; max-width: 100%; max-height: 100%; }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11,13,17,0.84);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 12px;
      }
      .overlay.hidden { display: none; }
      .overlay h1 { font-size: 26px; }
      .overlay p { font-size: 14px; color: #94a3b8; max-width: 360px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hud">
        <div class="metrics">
          <span class="metric">Left<strong id="p1-score">0</strong></span>
          <span class="metric">Right<strong id="p2-score">0</strong></span>
          <span class="metric">Mode<strong id="mode-label">1P</strong></span>
        </div>
        <div class="actions">
          <button type="button" id="mode-btn">Switch to 2P</button>
          <button type="button" id="restart-btn">Restart</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="court" width="640" height="400"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlay-title">Paddle Duel</h1>
          <p id="overlay-desc">1P: W/S or Up/Down arrows (or mouse). 2P: Left player uses W/S, Right player uses Up/Down. First to 7 wins.</p>
          <button type="button" id="start-btn" class="primary">Start Match</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('court');
      const ctx = canvas.getContext('2d');
      const p1El = document.getElementById('p1-score');
      const p2El = document.getElementById('p2-score');
      const modeLabel = document.getElementById('mode-label');
      const modeBtn = document.getElementById('mode-btn');
      const restartBtn = document.getElementById('restart-btn');
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');

      let twoPlayer = false;
      let state = 'TITLE_MENU';
      let p1Score = 0;
      let p2Score = 0;

      const p1 = { x: 24, y: 160, w: 12, h: 80, speed: 6 };
      const p2 = { x: 604, y: 160, w: 12, h: 80, speed: 6 };
      const ball = { x: 320, y: 200, r: 7, vx: 4.5, vy: 2.5 };
      const keys = {};

      function resetBall(direction = 1) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.vx = direction * 4.5;
        ball.vy = (Math.random() > 0.5 ? 1 : -1) * (2.2 + Math.random() * 1.8);
      }

      function startMatch() {
        p1Score = 0;
        p2Score = 0;
        p1El.textContent = '0';
        p2El.textContent = '0';
        p1.y = 160;
        p2.y = 160;
        resetBall(Math.random() > 0.5 ? 1 : -1);
        state = 'PLAYING';
        overlay.classList.add('hidden');
      }

      function update() {
        if (state !== 'PLAYING') return;

        if (keys['w'] || keys['W'] || (!twoPlayer && keys['ArrowUp'])) p1.y -= p1.speed;
        if (keys['s'] || keys['S'] || (!twoPlayer && keys['ArrowDown'])) p1.y += p1.speed;
        p1.y = Math.max(8, Math.min(canvas.height - p1.h - 8, p1.y));

        if (twoPlayer) {
          if (keys['ArrowUp']) p2.y -= p2.speed;
          if (keys['ArrowDown']) p2.y += p2.speed;
        } else {
          const target = ball.y - p2.h / 2;
          const diff = target - p2.y;
          p2.y += Math.sign(diff) * Math.min(Math.abs(diff), 4.2);
        }
        p2.y = Math.max(8, Math.min(canvas.height - p2.h - 8, p2.y));

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
          ball.vy *= -1;
          ball.y = Math.max(ball.r, Math.min(canvas.height - ball.r, ball.y));
        }

        // Paddle 1 hit
        if (
          ball.vx < 0 &&
          ball.x - ball.r <= p1.x + p1.w &&
          ball.x + ball.r >= p1.x &&
          ball.y >= p1.y &&
          ball.y <= p1.y + p1.h
        ) {
          const offset = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
          ball.vx = Math.min(9, Math.abs(ball.vx) * 1.05);
          ball.vy = offset * 5.5;
          ball.x = p1.x + p1.w + ball.r;
        }

        // Paddle 2 hit
        if (
          ball.vx > 0 &&
          ball.x + ball.r >= p2.x &&
          ball.x - ball.r <= p2.x + p2.w &&
          ball.y >= p2.y &&
          ball.y <= p2.y + p2.h
        ) {
          const offset = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
          ball.vx = -Math.min(9, Math.abs(ball.vx) * 1.05);
          ball.vy = offset * 5.5;
          ball.x = p2.x - ball.r;
        }

        if (ball.x < 0) {
          p2Score++;
          p2El.textContent = String(p2Score);
          if (p2Score >= 7) finishMatch(twoPlayer ? 'Right Player Wins' : 'Opponent Wins');
          else resetBall(1);
        } else if (ball.x > canvas.width) {
          p1Score++;
          p1El.textContent = String(p1Score);
          if (p1Score >= 7) finishMatch('Left Player Wins');
          else resetBall(-1);
        }
      }

      function finishMatch(title) {
        state = 'GAME_OVER';
        overlayTitle.textContent = title;
        overlayDesc.textContent = `Final Score: ${p1Score} – ${p2Score}`;
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }

      function draw() {
        ctx.fillStyle = '#111318';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 12);
        ctx.lineTo(canvas.width / 2, canvas.height - 12);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.roundRect(p1.x, p1.y, p1.w, p1.h, 5);
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.roundRect(p2.x, p2.y, p2.w, p2.h, 5);
        ctx.fill();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener('mousemove', (e) => {
        if (twoPlayer || state !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const scaleY = canvas.height / rect.height;
        const my = (e.clientY - rect.top) * scaleY;
        p1.y = Math.max(8, Math.min(canvas.height - p1.h - 8, my - p1.h / 2));
      });

      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
        keys[e.key] = true;
      });
      window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
      });

      modeBtn.addEventListener('click', () => {
        twoPlayer = !twoPlayer;
        modeLabel.textContent = twoPlayer ? '2P' : '1P';
        modeBtn.textContent = twoPlayer ? 'Switch to 1P' : 'Switch to 2P';
        startMatch();
      });

      startBtn.addEventListener('click', startMatch);
      restartBtn.addEventListener('click', startMatch);

      draw();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
