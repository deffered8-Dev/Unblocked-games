<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slope Run</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #0b0d11;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 12px;
        gap: 10px;
        max-width: 820px;
        margin: 0 auto;
      }
      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #161920;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
      }
      .metrics {
        display: flex;
        align-items: center;
        gap: 16px;
        font-variant-numeric: tabular-nums;
      }
      .metric strong {
        color: #fbbf24;
        font-weight: 700;
        margin-left: 4px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        background: #232730;
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 7px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #2d333f; }
      button.primary {
        background: #f59e0b;
        color: #0f172a;
        border-color: #f59e0b;
      }
      button.primary:hover { background: #fbbf24; }
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111318;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 13, 17, 0.84);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 12px;
      }
      .overlay.hidden { display: none; }
      .overlay h1 { font-size: 28px; font-weight: 700; color: #f8fafc; }
      .overlay p { font-size: 14px; color: #94a3b8; max-width: 380px; line-height: 1.5; }
      .touch-hint {
        font-size: 12px;
        color: #64748b;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hud">
        <div class="metrics">
          <span class="metric">Score<strong id="score-val">0</strong></span>
          <span class="metric">Best<strong id="best-val">0</strong></span>
          <span class="metric">Speed<strong id="speed-val">1.0x</strong></span>
        </div>
        <div class="actions">
          <button type="button" id="sound-btn">Sound: On</button>
          <button type="button" id="pause-btn">Pause</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="slope" width="760" height="460"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlay-title">Slope Run</h1>
          <p id="overlay-desc">Steer your sphere down the suspended slope track using A/D, Arrow keys, or left/right touch. Hit amber boost pads, clear gaps, and dodge coral hazard blocks.</p>
          <button type="button" id="start-btn" class="primary">Start Run</button>
        </div>
      </div>

      <p class="touch-hint">Controls: Left / Right Arrow or A / D (or hold left/right side on touch screens)</p>
    </div>

    <script>
      const canvas = document.getElementById('slope');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-val');
      const bestEl = document.getElementById('best-val');
      const speedEl = document.getElementById('speed-val');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const startBtn = document.getElementById('start-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');

      const BEST_KEY = 'recess_slope_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = String(best);

      let state = 'TITLE_MENU';
      let soundOn = true;
      let audioCtx = null;

      // Track & perspective settings
      const SEG_LEN = 4.2;
      const VISIBLE_SEGS = 28;
      const TRACK_HALF_W = 4.6;
      const FOV = 390;
      const CAM_HEIGHT = 3.2;
      const CAM_BACK = 5.5;

      let distance = 0;
      let speed = 24;
      let baseSpeed = 24;
      let score = 0;
      let ball = { x: 0, y: 0.45, vy: 0, vx: 0, r: 0.45, rot: 0 };
      let segments = [];
      let nextSegIndex = 0;
      let keys = { left: false, right: false };
      let touchSteer = 0;
      let lastTime = performance.now();
      let boostTimer = 0;

      function beep(freq, dur = 0.07, type = 'triangle') {
        if (!soundOn) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = type;
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.07, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start();
          o.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function trackOffsetAt(index) {
        if (index < 6) return 0;
        return Math.sin(index * 0.16) * 2.8 + Math.cos(index * 0.07) * 1.4;
      }

      function createSegment(idx) {
        const cx = trackOffsetAt(idx);
        const safe = idx < 8;
        let isGap = false;
        let hasBoost = false;
        let hasRamp = false;
        const obstacles = [];

        if (!safe) {
          // Occasional single-segment gap preceded by a ramp
          const prev = segments[segments.length - 1];
          if (prev && prev.hasRamp && !prev.isGap) {
            isGap = true;
          } else if (idx % 15 === 0) {
            hasRamp = true;
          } else if (idx % 11 === 0) {
            hasBoost = true;
          } else if (Math.random() < 0.56) {
            const count = idx > 40 && Math.random() < 0.35 ? 2 : 1;
            for (let k = 0; k < count; k++) {
              const lane = (Math.random() * 2 - 1) * (TRACK_HALF_W - 1.1);
              const moving = idx > 22 && Math.random() < 0.32;
              obstacles.push({
                offsetX: lane,
                w: 1.25,
                h: 1.2,
                moving,
                phase: Math.random() * Math.PI * 2,
                speed: (Math.random() > 0.5 ? 1 : -1) * (1.8 + Math.random() * 1.4),
              });
            }
          }
        }

        return {
          idx,
          zStart: idx * SEG_LEN,
          zEnd: (idx + 1) * SEG_LEN,
          cx,
          halfW: TRACK_HALF_W,
          isGap,
          hasBoost,
          hasRamp,
          obstacles,
        };
      }

      function resetGame() {
        distance = 0;
        baseSpeed = 25;
        speed = baseSpeed;
        score = 0;
        boostTimer = 0;
        ball = { x: 0, y: 0.45, vy: 0, vx: 0, r: 0.45, rot: 0 };
        segments = [];
        nextSegIndex = 0;
        for (let i = 0; i < VISIBLE_SEGS + 4; i++) {
          segments.push(createSegment(nextSegIndex++));
        }
        scoreEl.textContent = '0';
        speedEl.textContent = '1.0x';
      }

      function startGame() {
        resetGame();
        state = 'PLAYING';
        pauseBtn.textContent = 'Pause';
        overlay.classList.add('hidden');
        lastTime = performance.now();
        beep(520, 0.08);
      }

      function endGame(reason) {
        state = 'GAME_OVER';
        beep(160, 0.25, 'sawtooth');
        overlayTitle.textContent = 'Run Ended';
        overlayDesc.textContent = `${reason} · Score: ${score} · Best: ${best}`;
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }

      function project(wx, wy, wz) {
        // World coordinates relative to camera
        const relX = wx - ball.x * 0.65;
        const relY = wy - CAM_HEIGHT - ball.y * 0.45;
        const relZ = wz - (distance - CAM_BACK);
        if (relZ <= 0.4) return null;

        // Slight downhill pitch perspective
        const pitchY = relY + relZ * 0.14;
        const scale = FOV / relZ;
        return {
          sx: canvas.width / 2 + relX * scale,
          sy: canvas.height * 0.44 - pitchY * scale,
          scale,
          relZ,
        };
      }

      function update(dt) {
        if (state !== 'PLAYING') return;

        // Speed progression
        baseSpeed = Math.min(54, 25 + score * 0.14);
        if (boostTimer > 0) {
          boostTimer -= dt;
          speed = baseSpeed * 1.32;
        } else {
          speed = baseSpeed;
        }

        distance += speed * dt;
        ball.rot += speed * dt * 1.4;

        // Lateral steering
        let steer = 0;
        if (keys.left) steer -= 1;
        if (keys.right) steer += 1;
        if (touchSteer !== 0) steer = touchSteer;

        const targetVx = steer * 15.5;
        ball.vx += (targetVx - ball.vx) * Math.min(1, dt * 11);
        ball.x += ball.vx * dt;

        // Gravity / airborne vertical motion
        ball.vy -= 34 * dt;
        ball.y += ball.vy * dt;

        // Generate upcoming segments and prune passed ones
        while (segments.length && segments[0].zEnd < distance - CAM_BACK - 4) {
          segments.shift();
          score += 1;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            localStorage.setItem(BEST_KEY, String(best));
          }
        }
        while (segments.length < VISIBLE_SEGS + 4) {
          segments.push(createSegment(nextSegIndex++));
        }

        speedEl.textContent = (speed / 25).toFixed(1) + 'x';

        // Animate moving obstacles
        const nowSec = performance.now() / 1000;
        for (const seg of segments) {
          for (const obs of seg.obstacles) {
            if (obs.moving) {
              obs.currentOffset =
                Math.sin(nowSec * Math.abs(obs.speed) + obs.phase) * (seg.halfW - 1.0);
            } else {
              obs.currentOffset = obs.offsetX;
            }
          }
        }

        // Check current segment beneath the ball
        const activeSeg = segments.find((s) => distance >= s.zStart && distance < s.zEnd);
        if (activeSeg) {
          const onTrackX = Math.abs(ball.x - activeSeg.cx) <= activeSeg.halfW + 0.18;

          if (!activeSeg.isGap && onTrackX) {
            if (ball.y <= ball.r && ball.vy <= 0) {
              ball.y = ball.r;
              ball.vy = 0;

              if (activeSeg.hasRamp && !activeSeg._ramped) {
                activeSeg._ramped = true;
                ball.vy = 13.5;
                beep(660, 0.09);
              }
              if (activeSeg.hasBoost && !activeSeg._boosted) {
                activeSeg._boosted = true;
                boostTimer = 1.4;
                beep(780, 0.11);
              }
            }
          }

          // Check obstacle collision in active or next segment
          for (const seg of segments) {
            if (Math.abs((seg.zStart + SEG_LEN * 0.5) - distance) < 1.35) {
              for (const obs of seg.obstacles) {
                const ox = seg.cx + (obs.currentOffset ?? obs.offsetX);
                if (
                  Math.abs(ball.x - ox) < obs.w * 0.5 + ball.r * 0.72 &&
                  ball.y < obs.h + ball.r * 0.65
                ) {
                  endGame('Hit a hazard block');
                  return;
                }
              }
            }
          }
        }

        if (ball.y < -6.5) {
          endGame('Fell off the slope');
        }
      }

      function drawPoly(pts, fill, stroke) {
        if (pts.some((p) => !p)) return;
        ctx.beginPath();
        ctx.moveTo(pts[0].sx, pts[0].sy);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      function drawBox(cx, baseY, cz, w, h, d, topColor, frontColor, sideColor) {
        const hw = w / 2;
        const hd = d / 2;
        const zF = cz - hd;
        const zB = cz + hd;

        const flb = project(cx - hw, baseY, zF);
        const frb = project(cx + hw, baseY, zF);
        const flt = project(cx - hw, baseY + h, zF);
        const frt = project(cx + hw, baseY + h, zF);

        const blb = project(cx - hw, baseY, zB);
        const brb = project(cx + hw, baseY, zB);
        const blt = project(cx - hw, baseY + h, zB);
        const brt = project(cx + hw, baseY + h, zB);

        if (!flb || !frb || !flt || !frt || !blt || !brt) return;

        // Side faces if visible
        if (blb && cx - hw > ball.x * 0.65) {
          drawPoly([blb, flb, flt, blt], sideColor, 'rgba(0,0,0,0.25)');
        }
        if (brb && cx + hw < ball.x * 0.65) {
          drawPoly([frb, brb, brt, frt], sideColor, 'rgba(0,0,0,0.25)');
        }
        // Top face
        drawPoly([flt, frt, brt, blt], topColor, 'rgba(255,255,255,0.18)');
        // Front face
        drawPoly([flb, frb, frt, flt], frontColor, 'rgba(0,0,0,0.35)');
      }

      function draw() {
        // Sky gradient
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#0d1017');
        grad.addColorStop(0.55, '#151923');
        grad.addColorStop(1, '#1b1715');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle horizon grid lines
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 0.44);
        ctx.lineTo(canvas.width, canvas.height * 0.44);
        ctx.stroke();

        // Draw far-to-near segments
        for (let i = segments.length - 1; i >= 0; i--) {
          const seg = segments[i];
          const nextSeg = segments[i + 1];
          if (seg.isGap) continue;

          const x1L = seg.cx - seg.halfW;
          const x1R = seg.cx + seg.halfW;
          const nextCx = nextSeg ? nextSeg.cx : seg.cx;
          const x2L = nextCx - seg.halfW;
          const x2R = nextCx + seg.halfW;

          const p1L = project(x1L, 0, seg.zStart);
          const p1R = project(x1R, 0, seg.zStart);
          const p2L = project(x2L, 0, seg.zEnd);
          const p2R = project(x2R, 0, seg.zEnd);

          if (!p1L || !p1R || !p2L || !p2R) continue;

          const fade = Math.max(0.18, 1 - (seg.zStart - distance) / (VISIBLE_SEGS * SEG_LEN));
          const isAlt = seg.idx % 2 === 0;
          const deckColor = seg.hasBoost
            ? `rgba(245, 158, 11, ${0.42 * fade})`
            : seg.hasRamp
            ? `rgba(56, 189, 248, ${0.32 * fade})`
            : isAlt
            ? `rgba(35, 41, 54, ${0.95 * fade})`
            : `rgba(26, 30, 40, ${0.95 * fade})`;

          drawPoly(
            [p1L, p1R, p2R, p2L],
            deckColor,
            `rgba(245, 158, 11, ${0.35 * fade})`
          );

          // Center lane stripe
          const c1 = project(seg.cx, 0.02, seg.zStart + 0.5);
          const c2 = project(nextCx, 0.02, seg.zEnd - 0.5);
          if (c1 && c2) {
            ctx.strokeStyle = seg.hasBoost
              ? `rgba(251, 191, 36, ${0.9 * fade})`
              : `rgba(148, 163, 184, ${0.22 * fade})`;
            ctx.lineWidth = Math.max(1, c1.scale * 0.12);
            ctx.beginPath();
            ctx.moveTo(c1.sx, c1.sy);
            ctx.lineTo(c2.sx, c2.sy);
            ctx.stroke();
          }

          // Ramp visual marker
          if (seg.hasRamp) {
            const r1L = project(seg.cx - 2.2, 0.05, seg.zStart + 0.8);
            const r1R = project(seg.cx + 2.2, 0.05, seg.zStart + 0.8);
            const r2L = project(nextCx - 2.2, 0.65, seg.zEnd);
            const r2R = project(nextCx + 2.2, 0.65, seg.zEnd);
            drawPoly([r1L, r1R, r2R, r2L], 'rgba(56, 189, 248, 0.55)', 'rgba(186, 230, 253, 0.8)');
          }

          // Obstacles on segment
          const zMid = seg.zStart + SEG_LEN * 0.5;
          for (const obs of seg.obstacles) {
            const ox = seg.cx + (obs.currentOffset ?? obs.offsetX);
            drawBox(
              ox,
              0,
              zMid,
              obs.w,
              obs.h,
              1.35,
              '#fb7185',
              '#e11d48',
              '#9f1239'
            );
          }
        }

        // Ball shadow on track
        const activeSeg = segments.find((s) => distance >= s.zStart && distance < s.zEnd);
        if (activeSeg && !activeSeg.isGap && Math.abs(ball.x - activeSeg.cx) <= activeSeg.halfW + 0.2) {
          const shadowP = project(ball.x, 0.03, distance);
          if (shadowP) {
            const sr = Math.max(4, shadowP.scale * ball.r * Math.max(0.45, 1 - ball.y * 0.12));
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath();
            ctx.ellipse(shadowP.sx, shadowP.sy, sr * 1.15, sr * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Player sphere
        const ballP = project(ball.x, ball.y, distance);
        if (ballP) {
          const radius = Math.max(8, ballP.scale * ball.r);
          const sphereGrad = ctx.createRadialGradient(
            ballP.sx - radius * 0.3,
            ballP.sy - radius * 0.3,
            radius * 0.15,
            ballP.sx,
            ballP.sy,
            radius
          );
          sphereGrad.addColorStop(0, '#fef08a');
          sphereGrad.addColorStop(0.45, '#f59e0b');
          sphereGrad.addColorStop(1, '#b45309');

          ctx.fillStyle = sphereGrad;
          ctx.beginPath();
          ctx.arc(ballP.sx, ballP.sy, radius, 0, Math.PI * 2);
          ctx.fill();

          // Rolling meridian line so sphere rotation is tangible
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(
            ballP.sx,
            ballP.sy,
            radius * 0.9,
            Math.abs(Math.sin(ball.rot)) * radius * 0.85,
            0,
            0,
            Math.PI * 2
          );
          ctx.stroke();
        }
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === ' ' && state !== 'PLAYING' && state !== 'PAUSED') startGame();
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      });

      canvas.addEventListener('touchstart', (e) => {
        if (!e.touches[0]) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.touches[0].clientX - rect.left;
        touchSteer = x < rect.width / 2 ? -1 : 1;
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        touchSteer = 0;
      }, { passive: true });

      pauseBtn.addEventListener('click', () => {
        if (state === 'PLAYING') {
          state = 'PAUSED';
          pauseBtn.textContent = 'Resume';
          overlayTitle.textContent = 'Paused';
          overlayDesc.textContent = 'Press Resume to continue down the slope.';
          startBtn.textContent = 'Resume';
          overlay.classList.remove('hidden');
        } else if (state === 'PAUSED') {
          state = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.classList.add('hidden');
          lastTime = performance.now();
        }
      });

      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
      });

      startBtn.addEventListener('click', () => {
        if (state === 'PAUSED') {
          state = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.classList.add('hidden');
          lastTime = performance.now();
        } else {
          startGame();
        }
      });

      resetGame();
      draw();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
