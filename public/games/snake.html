<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Snake</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #0b0d11;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 12px;
        gap: 10px;
        max-width: 720px;
        margin: 0 auto;
      }
      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #161920;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
      }
      .metrics {
        display: flex;
        align-items: center;
        gap: 16px;
        font-variant-numeric: tabular-nums;
      }
      .metric strong {
        color: #fbbf24;
        font-weight: 700;
        margin-left: 4px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        background: #232730;
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 7px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #2d333f; }
      button.primary {
        background: #f59e0b;
        color: #0f172a;
        border-color: #f59e0b;
      }
      button.primary:hover { background: #fbbf24; }
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111318;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 13, 17, 0.84);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 12px;
      }
      .overlay.hidden { display: none; }
      .overlay h1 { font-size: 26px; font-weight: 700; color: #f8fafc; }
      .overlay p { font-size: 14px; color: #94a3b8; max-width: 340px; line-height: 1.5; }
      .dpad {
        display: none;
        grid-template-columns: repeat(3, 44px);
        gap: 6px;
        justify-content: center;
      }
      @media (pointer: coarse), (max-width: 640px) {
        .dpad { display: grid; }
      }
      .dpad button { height: 40px; padding: 0; font-size: 15px; }
      .empty { visibility: hidden; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hud">
        <div class="metrics">
          <span class="metric">Score<strong id="score-val">0</strong></span>
          <span class="metric">Best<strong id="best-val">0</strong></span>
          <span class="metric">Speed<strong id="speed-val">1x</strong></span>
        </div>
        <div class="actions">
          <button type="button" id="sound-btn">Sound: On</button>
          <button type="button" id="pause-btn">Pause</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="board" width="480" height="480"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlay-title">Grid Snake</h1>
          <p id="overlay-desc">Use Arrow keys or WASD to guide the snake toward golden orbs. Avoid walls and your own tail.</p>
          <button type="button" id="start-btn" class="primary">Start Game</button>
        </div>
      </div>

      <div class="dpad" aria-label="Touch directional pad">
        <span class="empty"></span>
        <button type="button" data-dir="up">▲</button>
        <span class="empty"></span>
        <button type="button" data-dir="left">◀</button>
        <button type="button" data-dir="down">▼</button>
        <button type="button" data-dir="right">▶</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-val');
      const bestEl = document.getElementById('best-val');
      const speedEl = document.getElementById('speed-val');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const startBtn = document.getElementById('start-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');

      const GRID = 20;
      const CELL = canvas.width / GRID;
      const BEST_KEY = 'recess_snake_best';

      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      let state = 'TITLE_MENU';
      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = { x: 14, y: 10 };
      let score = 0;
      let tickMs = 125;
      let lastTick = 0;
      let soundOn = true;
      let audioCtx = null;

      function beep(freq, dur = 0.07) {
        if (!soundOn) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function spawnFood() {
        while (true) {
          const x = Math.floor(Math.random() * GRID);
          const y = Math.floor(Math.random() * GRID);
          if (!snake.some((s) => s.x === x && s.y === y)) {
            food = { x, y };
            return;
          }
        }
      }

      function resetGame() {
        snake = [
          { x: 6, y: 10 },
          { x: 5, y: 10 },
          { x: 4, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        tickMs = 125;
        scoreEl.textContent = '0';
        speedEl.textContent = '1.0x';
        spawnFood();
      }

      function startGame() {
        resetGame();
        state = 'PLAYING';
        pauseBtn.textContent = 'Pause';
        overlay.classList.add('hidden');
        lastTick = performance.now();
      }

      function endGame() {
        state = 'GAME_OVER';
        beep(180, 0.22);
        overlayTitle.textContent = 'Game Over';
        overlayDesc.textContent = `Final Score: ${score} · Best: ${best}`;
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }

      function setDirection(nx, ny) {
        if (state !== 'PLAYING') return;
        if (nx === -dir.x && ny === -dir.y) return;
        nextDir = { x: nx, y: ny };
      }

      function step() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (
          head.x < 0 ||
          head.y < 0 ||
          head.x >= GRID ||
          head.y >= GRID ||
          snake.some((seg) => seg.x === head.x && seg.y === head.y)
        ) {
          endGame();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            localStorage.setItem(BEST_KEY, String(best));
          }
          tickMs = Math.max(65, 125 - Math.floor(score / 40) * 6);
          speedEl.textContent = (125 / tickMs).toFixed(1) + 'x';
          beep(560, 0.08);
          spawnFood();
        } else {
          snake.pop();
        }
      }

      function draw() {
        ctx.fillStyle = '#111318';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }

        // Food orb
        const fx = food.x * CELL + CELL / 2;
        const fy = food.y * CELL + CELL / 2;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(fx, fy, CELL * 0.34, 0, Math.PI * 2);
        ctx.fill();

        // Snake body
        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#f59e0b' : idx % 2 === 0 ? '#10b981' : '#059669';
          const pad = idx === 0 ? 2 : 3;
          ctx.beginPath();
          ctx.roundRect(
            seg.x * CELL + pad,
            seg.y * CELL + pad,
            CELL - pad * 2,
            CELL - pad * 2,
            5
          );
          ctx.fill();
        });
      }

      function loop(now) {
        if (state === 'PLAYING' && now - lastTick >= tickMs) {
          lastTick = now;
          step();
        }
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
        }
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection(0, -1);
        else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection(0, 1);
        else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection(-1, 0);
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection(1, 0);
        else if (e.key === ' ' && state !== 'PLAYING') startGame();
      });

      document.querySelectorAll('.dpad button').forEach((btn) => {
        btn.addEventListener('click', () => {
          const d = btn.dataset.dir;
          if (d === 'up') setDirection(0, -1);
          if (d === 'down') setDirection(0, 1);
          if (d === 'left') setDirection(-1, 0);
          if (d === 'right') setDirection(1, 0);
        });
      });

      pauseBtn.addEventListener('click', () => {
        if (state === 'PLAYING') {
          state = 'PAUSED';
          pauseBtn.textContent = 'Resume';
          overlayTitle.textContent = 'Paused';
          overlayDesc.textContent = 'Press Resume to continue your run.';
          startBtn.textContent = 'Resume';
          overlay.classList.remove('hidden');
        } else if (state === 'PAUSED') {
          state = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.classList.add('hidden');
          lastTick = performance.now();
        }
      });

      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
      });

      startBtn.addEventListener('click', () => {
        if (state === 'PAUSED') {
          state = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.classList.add('hidden');
          lastTick = performance.now();
        } else {
          startGame();
        }
      });

      resetGame();
      draw();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
